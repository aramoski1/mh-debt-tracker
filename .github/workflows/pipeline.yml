name: Nightly pipeline

on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC = 2:17 AM Arizona
  workflow_dispatch:
    inputs:
      skip_extract:
        description: "Skip reading documents with Claude"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Vertical Frame research alec@verticalframe.ai' }}
      TARGET_STATES: ${{ vars.TARGET_STATES || 'AZ' }}
      MAX_DOCS_PER_RUN: ${{ vars.MAX_DOCS_PER_RUN || '200' }}
      MARICOPA_RECORDER_SEARCH_URL: ${{ vars.MARICOPA_RECORDER_SEARCH_URL }}
      CACHE_DIR: .cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - run: pip install -e .
      - name: Check the database
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg

          url = os.environ.get("DATABASE_URL") or ""
          if not url:
              sys.exit(
                  "DATABASE_URL secret is empty. Add it under Settings, Secrets and variables, Actions."
              )
          psycopg.connect(url, connect_timeout=20).close()
          print("database reachable")
          PY
      - run: mhdebt run ${{ inputs.skip_extract && '--skip-extract' || '' }}
      - run: mhdebt jobs

