[project]
name = "mhdebt"
version = "0.1.0"
description = "Debt maturity intelligence for mobile home and RV parks"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "lxml>=5.0",
  "psycopg[binary]>=3.1",
  "rapidfuzz>=3.6",
  "typer>=0.12",
  "anthropic>=0.40",
  "pydantic>=2.6",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
mhdebt = "mhdebt.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mhdebt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
